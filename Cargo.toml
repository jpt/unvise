[package]
name = "unvise"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Extractor for Installer VISE archives (MindVision, 1990s-2000s Mac and Windows)"
repository = "https://github.com/jpt/unvise"
keywords = ["vise", "installer-vise", "classic-mac", "archive", "decompress"]
categories = ["command-line-utilities", "compression"]
readme = "README.md"

[dependencies]
flate2 = { version = "1", features = ["zlib-ng"], default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
# Exposes decompression internals to the fuzz targets in fuzz/. Off by default,
# so the normal build and public API stay unchanged
fuzzing = []
