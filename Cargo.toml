[package]
name = "unvise"
version = "0.1.7"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Extractor for Installer VISE archives (MindVision, 1990s-2000s Mac)"
repository = "https://github.com/jpt/unvise"
keywords = ["vise", "installer-vise", "classic-mac", "archive", "decompress"]
categories = ["command-line-utilities", "compression"]
readme = "README.md"

[dependencies]
flate2 = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
urlencoding = "2"

[features]
# Exposes decompression internals to the fuzz targets in fuzz/. Off by default,
# so the normal build and public API stay unchanged.
fuzzing = []
